name: Rentlytics
description: 'Rentlytics was a multifamily real estate data analytics company founded in 2012 and headquartered
  in San Francisco, CA (with offices in Sacramento and Denver). Its platform consolidated operational and
  financial data scattered across multifamily assets into a unified business-intelligence layer, and it
  shipped products such as Open Data Services and Renovation Manager for per-unit and per-property yield
  visibility. Rentlytics was acquired by RealPage in 2018 for roughly $57 million and folded into RealPage''s
  real-estate platform. As of this enrichment pass the standalone rentlytics.com domain is parked (it
  redirects to a generic lander) and the company operates no independent public developer portal, API
  documentation, or machine-readable API surface. It was surfaced as a portfolio company of Trinity Ventures.'
